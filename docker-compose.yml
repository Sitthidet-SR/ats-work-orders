name: ats-work-orders
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats_local}
      POSTGRES_DB: ats
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ats -d ats']
      interval: 5s
      retries: 15
  object-storage:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ats_local}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: ['object_data:/data']
  storage-init:
    image: ats-work-orders-backend:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on: [object-storage]
    env_file: .env
    environment:
      STORAGE_ENDPOINT: http://object-storage:9000
    command: pnpm --filter api storage:init
  backend:
    image: ats-work-orders-backend:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ats:${POSTGRES_PASSWORD:-ats_local}@postgres:5432/ats?schema=public
      STORAGE_ENDPOINT: http://object-storage:9000
      PORT: 4000
      NODE_ENV: development
      # Browser download URLs use the host's object storage endpoint.
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    command: sh -c "pnpm --filter api db:migrate && pnpm --filter api db:seed && pnpm --filter api start:prod"
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports: ['3000:3000']
    depends_on: [backend]
volumes:
  postgres_data:
  object_data:
